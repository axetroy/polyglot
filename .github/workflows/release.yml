name: Release

on:
  push:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    name: Publish to npm
    runs-on: ubuntu-latest
    # Only publish when a version-bump commit lands on main.
    # The changeset tool creates this commit automatically after its PR is merged.
    if: >-
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') &&
      contains(github.event.head_commit.message, 'chore: version bump')
    permissions:
      contents: write # git tag
      id-token: write # npm provenance (OIDC, no secret needed)
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      - run: npm ci --ignore-scripts
      - run: npm run build

      # Publish public packages with provenance.
      # --provenance: npm auto-generates a sigstore attestation linked to
      #               this GitHub Actions run — no extra env vars needed.
      # NPM_TOKEN: set once by repo owner; stored as a GitHub secret.
      - run: |
          npm publish -w @polyglot/sdk  --provenance --access public
          npm publish -w @polyglot/cli  --provenance --access public
          npm publish -w @polyglot/browser --provenance --access public
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create Git tag
        run: |
          SDK_VERSION=$(node -p "require('./packages/sdk/package.json').version")
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "v${SDK_VERSION}" -m "Release v${SDK_VERSION}"
          git push origin "v${SDK_VERSION}"
