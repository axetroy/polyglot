name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci --ignore-scripts
      - run: npm run typecheck

  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci --ignore-scripts
      - run: npm run lint
      - run: npm run format:check

  test:
    name: Test (${{ matrix.os }} / Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ['20', '22']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: 'npm'
      # The compatibility suite shells out to real archive tools and reports
      # skipped tests when they are missing, so install them per-platform to
      # make the third-party contracts actually execute everywhere:
      #
      #   Linux   -> unzip + zipinfo (Info-ZIP), bsdtar (libarchive), 7zz (official 7-Zip tarball)
      #   macOS   -> unzip/zipinfo/bsdtar/python3 are pre-installed; install 7zz via Homebrew
      #   Windows -> 7z (chocolatey); tar (built-in, libarchive); python (built-in); unzip best-effort
      - name: Install archive tools (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y unzip zip libarchive-tools
      - name: Install official 7-Zip (Linux)
        if: runner.os == 'Linux'
        run: |
          curl -fsSL -o /tmp/7z.tar.xz https://www.7-zip.org/a/7z2409-linux-x64.tar.xz
          mkdir -p /tmp/7zz && tar -xJf /tmp/7z.tar.xz -C /tmp/7zz
          echo "/tmp/7zz" >> "$GITHUB_PATH"
      - name: Install archive tools (macOS)
        if: runner.os == 'macOS'
        run: brew install sevenzip
      - name: Install archive tools (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install 7zip -y --no-progress
          choco install unzip -y --no-progress
        continue-on-error: true
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: npm test

  build:
    name: Build All Packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: node packages/cli/dist/index.js --help

  docs:
    name: Build Docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci --ignore-scripts
      - run: npm run docs:build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/.vitepress/dist
