<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 150" width="520" height="150" fill="none">
  <title>Polyglot — Dual-Format File Engine</title>
  <desc>A single file combining image and ZIP archive formats.</desc>

  <!-- Single file with a folded corner -->
  <g transform="translate(18 14)">
    <path d="M22 0H79L104 25V113Q104 122 95 122H9Q0 122 0 113V9Q0 0 9 0Z" fill="#172B4D" />
    <path d="M79 0V20Q79 25 84 25H104Z" fill="#456184"/>

    <!-- Image: sun and mountain -->
    <circle cx="28" cy="40" r="8" fill="#FBBF24"/>
    <path d="M9 83L34 56L51 73L64 62L95 94V109H9Z" fill="#38BDF8"/>
    <path d="M9 91L34 68L51 85L64 74L95 106V109H9Z" fill="#0EA5E9"/>

    <!-- ZIP archive: zipper integrated into the image -->
    <path d="M61 34V94" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-dasharray="3 5" />
    <path d="M53 40H69M53 51H69M53 62H69M53 73H69M53 84H69" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" />
    <path d="M51 29L61 34L71 29M51 99L61 94L71 99" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Wordmark -->
  <text x="145" y="79" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="49" font-weight="750" letter-spacing="-2" fill="#172B4D">Polyglot</text>

  <!-- Descriptor -->
  <text x="148" y="105" font-family="ui-monospace, SFMono-Regular, monospace" font-size="11" letter-spacing="2" fill="#64748B">DUAL-FORMAT FILE ENGINE</text>
</svg>
