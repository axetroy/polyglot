<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <title>Polyglot</title>
  <desc>
    One file combining an image and a ZIP archive.
  </desc>

  <!-- Unified file -->
  <rect x="7" y="5" width="114" height="118" rx="17" fill="#172B4D"/>

  <!-- Folded corner -->
  <path d="M88 5 L121 38 H97 Q88 38 88 29 Z" fill="#456184"/>

  <!-- Image: sun -->
  <circle cx="33" cy="37" r="8" fill="#FBBF24"/>

  <!-- Image: mountains -->
  <path d="M12 71 L32 49 L45 62 L53 55
           L64 66 V105 Q64 114 55 114
           H21 Q12 114 12 105 Z" fill="#38BDF8"/>

  <path d="M12 84 L31 68 L43 79 L53 72
           L64 82 V105 Q64 114 55 114
           H21 Q12 114 12 105 Z" fill="#0EA5E9"/>

  <!-- ZIP zipper -->
  <path d="M75 27 V87" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-dasharray="2 5"/>

  <path d="M70 32 H80
           M70 42 H80
           M70 52 H80
           M70 62 H80
           M70 72 H80" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>

  <!-- Zipper slider -->
  <rect x="69" y="78" width="12" height="19" rx="4" fill="#FFFFFF"/>

  <rect x="73" y="82" width="4" height="11" rx="1.5" fill="#172B4D"/>

  <path d="M75 97 V105" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
</svg>
